{% extends "base.html" %}

{% block title %}Driver Registration | EV Charge{% endblock %}

{% block content %}
<section class="section" style="padding-top: 50px;">
    <div class="container" style="max-width: 540px;">
        <div style="background: var(--bg-card); border: 1px solid var(--border-accent); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-lg);">
            
            <div style="text-align: center; margin-bottom: 28px;">
                <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 style="font-size: 1.8rem; margin-bottom: 6px;">Create EV Driver Account</h1>
                <p style="color: var(--text-secondary); font-size: 0.92rem;">Join the smart charging network and reserve slots in seconds</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}" onsubmit="return validateRegisterForm()">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name *</label>
                    <input type="text" name="name" id="regName" class="form-control" placeholder="Rahul Sharma" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="regEmail">Email Address *</label>
                        <input type="email" name="email" id="regEmail" class="form-control" placeholder="rahul@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regPhone">Phone Number *</label>
                        <input type="tel" name="phone" id="regPhone" class="form-control" placeholder="+91 98765 43210" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="regVehicle">Vehicle Type / Model</label>
                        <select name="vehicle_type" id="regVehicle" class="form-control">
                            <option value="Tata Nexon EV Max">Tata Nexon EV Max</option>
                            <option value="Tata Punch EV">Tata Punch EV</option>
                            <option value="MG ZS EV">MG ZS EV</option>
                            <option value="Mahindra XUV400">Mahindra XUV400</option>
                            <option value="Hyundai Ioniq 5">Hyundai Ioniq 5</option>
                            <option value="BYD Atto 3">BYD Atto 3</option>
                            <option value="Tesla Model 3 / Y">Tesla Model 3 / Y</option>
                            <option value="Other EV">Other Electric Vehicle</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regVehNum">Vehicle Number</label>
                        <input type="text" name="vehicle_number" id="regVehNum" class="form-control" placeholder="AP-05-EV-1001" style="text-transform: uppercase;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="regPass">Password *</label>
                        <input type="password" name="password" id="regPass" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regConfirmPass">Confirm Password *</label>
                        <input type="password" name="confirm_password" id="regConfirmPass" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-user-check"></i> Create Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-secondary);">
                Already have an account? <a href="{{ url_for('login') }}" style="color: var(--electric-cyan); font-weight: 600;">Login</a>
            </div>

        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
function validateRegisterForm() {
    const pass = document.getElementById('regPass').value;
    const confirm = document.getElementById('regConfirmPass').value;
    if (pass !== confirm) {
        showToast('Passwords do not match. Please re-enter.', 'danger');
        return false;
    }
    return true;
}
</script>
{% endblock %}
